version: "15.0"
description: Defines Discord client lifecycle requirements.
directives:
  - id: E-200.1
    dos:
      - Make client.shutdown idempotent.
      - Return the same pending shutdown promise for repeated calls.
      - Expose client.shutdown as the public client cleanup method.
      - Remove library event listeners and handlers during shutdown.
      - Remove loaded locale data during shutdown.
      - Keep locale data separate for each Discord client.
      - Call `client.destroy()` during shutdown.
      - Run available cleanup when setup or login fails.
      - Preserve available process handler cleanup when process handler setup fails.
      - Keep signal and process handlers optional.
      - When an app owns other services, let the app manage their shutdown.
      - When an app handles shutdown, call client.shutdown from its coordinator.
      - When an app handles signals and manual shutdown, use the same coordinator.
    donts:
      - Do not require consumers to call `client.destroy()` directly.
      - Do not make the library own app services.
      - Do not require consumers to import a separate client shutdown function.
