version: "12.0"
description: Defines requirements for the @eliware/discord package.
directives:
  - id: E-200.0
    dos:
      - Export createDiscord, shutdownDiscord, purgeCommands, and splitMsg from the package root.
      - Keep app command, event, and locale files in the consuming app.
      - Disable gateway intents by default.
    donts:
      - Do not connect to Discord when the package module loads.
      - Do not delete commands automatically.
